<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#173b24">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Property Inspector">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="../icon-192.png">
      <title>Property Inspector 3.13 Safe Home Test</title>
  <style>
    :root {
      --bg: #ece9df;
      --card: #fff;
      --ink: #111b14;
      --muted: #536058;
      --green: #1d5b32;
      --dark-green: #173b24;
      --red: #c72424;
      --blue: #155fbd;
      --purple: #63389a;
      --amber: #9a5b00;
      --focus: #ffe34f;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; overflow-x: hidden; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    body { padding-bottom: max(20px, env(safe-area-inset-bottom)); position: static; }
    header { background: var(--dark-green); color: #fff; padding: max(12px, env(safe-area-inset-top)) 14px 12px; }
    header h1 { margin: 0; font-size: 23px; line-height: 1.15; }
    header p { margin: 5px 0 0; font-size: 13px; opacity: .9; }
    #offlineState { display: inline-block; margin-top: 8px; border: 2px solid #fff; border-radius: 999px; padding: 5px 10px; font-size: 13px; font-weight: 800; }
    #offlineState[data-ready="true"] { color: #0c3218; background: #8bf0a5; border-color: #8bf0a5; }
    #offlineState[data-ready="false"] { color: #3b0b0b; background: #ffaaa3; border-color: #ffaaa3; }
    #workflow { position: sticky; top: 0; z-index: 20; background: rgba(255,255,255,.98); border-bottom: 2px solid #a7a79d; padding: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.15); }
    #nextStep { background: #111; color: #fff; border-left: 7px solid var(--focus); padding: 10px 11px; min-height: 48px; font-weight: 850; font-size: 16px; line-height: 1.3; }
    #primaryControls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
    button, .button-link { min-height: 54px; border: 0; border-radius: 8px; padding: 10px 8px; color: #fff; background: var(--green); font: 800 16px/1.15 -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; text-align: center; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    button:active, .button-link:active { transform: scale(.985); }
    button:focus-visible, .button-link:focus-visible { outline: 4px solid var(--focus); outline-offset: 2px; }
    button:disabled { opacity: .38; transform: none; }
    #start { background: #18783a; }
    #finish { background: #111; border: 3px solid var(--focus); }
    #stop { grid-column: 1 / -1; background: #4c5650; }
    #status { margin-top: 8px; border-radius: 6px; background: #1d2420; color: #fff; padding: 9px 10px; min-height: 42px; font: 700 13px/1.35 ui-monospace, SFMono-Regular, Menlo, monospace; }
    #status[data-kind="error"] { background: #8e1111; }
    #status[data-kind="warning"] { background: #704400; }
    #status[data-kind="success"] { background: #096028; }
    #status[data-kind="active"] { background: #173f60; }
    main { max-width: 1200px; margin: 0 auto; }
    .card { background: var(--card); border: 1px solid #c7c5bb; border-radius: 9px; padding: 12px; margin: 10px; box-shadow: 0 1px 2px rgba(0,0,0,.05); }
    .card h2 { margin: 0 0 4px; font-size: 19px; }
    .card > p:first-of-type { margin-top: 4px; }
    #fieldButtons { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }
    #fieldButtons button { min-height: 62px; font-size: 15px; }
    button.wet { background: var(--blue); }
    button.dry { background: #80620d; }
    button.blocked { background: var(--red); }
    button.high { background: #a34300; }
    button.homesite { background: #177252; }
    button.culvert { background: #275975; }
    button.tree { background: #327019; }
    button.entrance { background: #75551c; }
    button.wildlife { background: #5b4d1b; }
    button.photo { background: var(--purple); }
    button.voice { background: #9b1e58; }
    button.voice.recording { animation: recordPulse 1.25s infinite; background: #d0063b; }
    button.note { background: #4d5960; }
    button.thought { background: #69468f; }
    button.more { background: #273238; }
    @keyframes recordPulse { 50% { box-shadow: 0 0 0 6px rgba(208,6,59,.25); } }
    #mapFrame { position: relative; width: calc(100% - 20px); margin: 10px auto 0; background: #d8d1bd; overflow: hidden; aspect-ratio: 1800/1500; border: 2px solid #777; border-radius: 8px; touch-action: pan-x pan-y; }
    #mapFrame img, #overlay { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #hillshade { z-index: 1; }
    #contours { z-index: 2; opacity: .9; }
    #overlay { z-index: 3; pointer-events: none; }
    .metrics { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .metric { min-width: 0; background: #f5f5f0; border-radius: 6px; padding: 8px; }
    .metric span { display: block; color: var(--muted); font-size: 11px; font-weight: 700; }
    .metric strong { display: block; margin-top: 3px; overflow-wrap: anywhere; font-size: 17px; }
    .condition-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 12px; }
    .weather-verification { margin: 10px 0 14px; padding: 12px; border: 3px solid #8b6a12; border-radius: 9px; background: #fff9dd; }
    .weather-verification[data-state="verified"] { border-color: #176d38; background: #e8f8ed; }
    .weather-verification[data-state="warning"] { border-color: #a3261d; background: #fff0ee; }
    .weather-verification h3 { margin: 0 0 6px; font-size: 17px; }
    .weather-verification p { margin: 5px 0; }
    .weather-verification button { width: 100%; margin-top: 8px; }
    .condition-grid label { margin-top: 4px; }
    .condition-grid input, .condition-grid select, .condition-grid textarea,
    dialog input, dialog select, dialog textarea { width: 100%; min-height: 48px; margin-top: 5px; border: 2px solid #777; border-radius: 7px; padding: 9px; background: #fff; color: #111; font: 16px/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
    .condition-grid textarea, dialog textarea { min-height: 78px; resize: vertical; }
    .choice-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; margin-top: 6px; }
    .choice-grid label { min-height: 50px; margin: 0; border: 2px solid #8a8a82; border-radius: 7px; padding: 8px; background: #f6f6f1; display: flex; align-items: center; gap: 7px; }
    .choice-grid input { width: 24px; min-height: 24px; margin: 0; flex: 0 0 auto; }
    dialog { width: min(560px, calc(100vw - 18px)); max-height: calc(100vh - 24px); border: 3px solid #111; border-radius: 10px; padding: 0; overflow: auto; }
    dialog::backdrop { background: rgba(0,0,0,.72); }
    .dialog-body { padding: 14px; }
    .dialog-body h2 { margin: 0 0 6px; }
    .dialog-actions { position: sticky; bottom: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 10px 14px max(10px, env(safe-area-inset-bottom)); background: #fff; border-top: 2px solid #bbb; }
    .dialog-actions .cancel { background: #59615c; }
    #moreCategories[hidden], .structured-fields[hidden] { display: none; }
    #moreCategories { margin-top: 10px; border-top: 2px solid #aaa; padding-top: 10px; }
    #moreCategories h3 { margin: 0 0 8px; font-size: 16px; }
    #moreButtons { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    #moreButtons button { min-height: 60px; background: #425148; }
    #gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(145px, 1fr)); gap: 8px; margin-top: 10px; }
    .thumb { border: 2px solid #bcbcb4; border-radius: 7px; padding: 6px; font-size: 11px; line-height: 1.4; }
    .thumb img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 4px; margin-bottom: 5px; }
    .photo-error { color: #890d0d; border-color: #b00000; background: #fff0ef; }
    .lineKey { display: inline-block; width: 32px; height: 0; vertical-align: middle; margin-right: 7px; }
    .subjectKey { border-top: 6px solid #ff2020; }
    .neighborKey { border-top: 3px solid #fff; box-shadow: 0 1px 0 #111; }
    .small { color: var(--muted); font-size: 13px; line-height: 1.45; }
    .field-warning { border-left: 7px solid var(--amber); }
    label { display: block; margin-top: 10px; font-weight: 700; font-size: 14px; }
    input[type="range"] { width: min(250px, 70vw); vertical-align: middle; }
    #packageReady { border: 3px solid #0b762f; background: #ecfff2; }
    #packageReady[hidden], #packageLink[hidden], #sharePackage[hidden] { display: none; }
    #packageReady p { font-weight: 700; }
    #packageFilename { display: block; padding: 9px; border: 2px dashed #0b762f; background: #fff; overflow-wrap: anywhere; font: 800 15px/1.35 ui-monospace, SFMono-Regular, Menlo, monospace; }
    #packageLink, #sharePackage { display: block; width: 100%; margin-top: 8px; text-decoration: none; background: #0b762f; }
    #sharePackage { background: #111; border: 3px solid var(--focus); }
    .export-modes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 10px; }
    .export-mode { border: 2px solid #777; border-radius: 8px; padding: 10px; background: #f7f7f2; }
    .export-mode.recommended { border: 3px solid #11652d; background: #edfff1; }
    .export-mode h3 { margin: 0 0 5px; font-size: 16px; }
    .export-mode p { margin: 4px 0; }
    .package-estimate { display: block; margin-top: 8px; font: 900 18px/1.25 ui-monospace, SFMono-Regular, Menlo, monospace; }
    #fullArchive { width: 100%; margin-top: 9px; background: #492568; }
    #estimateWarning { color: #8b1010; font-weight: 900; }
    #retryPendingPhoto { width: 100%; margin: 8px 0; background: #8a4400; border: 3px solid var(--focus); }
    #retryPendingPhoto[hidden], #galleryPager[hidden] { display: none; }
    #galleryPager { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; margin-top: 10px; }
    #galleryPager button { min-height: 48px; background: #4c5650; }
    #galleryPageInfo { font-weight: 900; text-align: center; white-space: nowrap; }
    details summary { min-height: 44px; padding: 10px 0; font-weight: 800; cursor: pointer; }
    .utilityButtons { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .utilityButtons button { background: #56625b; font-size: 14px; }
    .coach-card { border: 3px solid #173b24; }
    .coach-grid { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: end; }
    .coach-grid label { margin: 0; }
    .coach-grid button { min-width: 116px; }
    .coach-grid input, .coach-grid select { display: block; width: 100%; min-height: 50px; margin-top: 5px; border: 2px solid #777; border-radius: 7px; padding: 8px; background: #fff; color: #111; font-size: 16px; }
    #questionList { display: grid; gap: 8px; margin-top: 10px; }
    .question-row { border: 2px solid #777; border-radius: 8px; padding: 9px; background: #f7f7f2; }
    .question-row.active { border-color: #155fbd; background: #edf6ff; }
    .question-row label { display: flex; gap: 8px; align-items: flex-start; margin: 0; font-size: 15px; }
    .question-row input[type="checkbox"] { width: 26px; height: 26px; margin: 0; flex: 0 0 auto; }
    .question-controls { display: grid; grid-template-columns: 1fr auto; gap: 7px; margin-top: 8px; }
    .question-controls select { width: 100%; min-height: 44px; border: 2px solid #777; border-radius: 7px; background: #fff; font-size: 15px; }
    .question-controls button { min-height: 44px; background: #4d5960; font-size: 14px; }
    #coachNextAction { margin: 10px 0 0; padding: 10px; border-left: 7px solid var(--focus); background: #111; color: #fff; font-weight: 850; }
    .evidence-mode { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
    .evidence-mode select { width: 100%; min-height: 50px; border: 2px solid #777; border-radius: 7px; background: #fff; font-size: 16px; }
    .coverage-key { display: grid; grid-template-columns: repeat(3,1fr); gap: 7px; margin-top: 8px; }
    .coverage-key div { border: 2px solid #777; border-radius: 7px; padding: 8px; text-align: center; }
    .coverage-key strong { display: block; font-size: 20px; }
    .coverage-well { background: #b9efc6; }
    .coverage-light { background: #fff1a6; }
    .coverage-none { background: #dedede; }
    #missingEvidenceList { margin: 8px 0; padding-left: 22px; }
    #reviewEvidence { width: 100%; background: #8a4400; border: 3px solid var(--focus); }
    .report-review-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
    .report-review-grid button { min-height:62px; }
    #reviewSynthesisPanel { margin-top:12px; border:3px solid #173f5f; border-radius:8px; padding:10px; background:#f5f8fa; }
    .review-synthesis-row { border:2px solid #777; border-radius:7px; padding:10px; margin:9px 0; background:#fff; }
    .review-synthesis-row[data-status="approved"] { border-color:#1d6f42; background:#e9f7ee; }
    .review-synthesis-row[data-status="rejected"] { border-color:#971b1b; background:#fff0f0; }
    .review-synthesis-actions { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px; }
    #newInspectionPhase { background:#4f3a75; }
    .photo-value-select { width: 100%; min-height: 42px; margin-top: 6px; border: 2px solid #777; border-radius: 6px; background: #fff; font-size: 14px; }
    .water-rule { display:block; margin:12px 0; padding:12px; border:3px solid #1768c4; border-radius:8px; background:#edf7ff; font-weight:800; }
    .water-rule input { width:28px; height:28px; vertical-align:middle; margin-right:8px; }
    #smallWaterMapFrame { position:relative; width:100%; min-height:420px; border:3px solid #164b75; background:#d9d9d9; overflow:hidden; }
    #smallWaterMap { display:block; width:100%; min-height:420px; touch-action:manipulation; }
    .water-layer-controls { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:6px; margin:10px 0; }

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Safari GPS Diagnostic</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;margin:0;background:#111;color:#fff}.wrap{max-width:680px;margin:auto;padding:24px}.card{background:#222;border-radius:18px;padding:20px;margin:14px 0}h1{font-size:28px}.big{font-size:22px;font-weight:800}.ok{background:#153b22}.bad{background:#4a1919}.wait{background:#493d12}button{width:100%;font-size:20px;font-weight:800;padding:18px;border:0;border-radius:14px;margin:8px 0;background:#fff;color:#111}pre{white-space:pre-wrap;word-break:break-word;font-size:15px}</style></head><body><div class="wrap"><h1>SAFARI GPS TEST</h1><div id="status" class="card wait"><div class="big">TESTING SAFARI LOCATION…</div><p>Keep this page open. If Safari asks for Location, tap Allow.</p></div><button id="again">TEST AGAIN</button><div class="card"><strong>Details</strong><pre id="details"></pre></div></div><script>
const s=document.getElementById('status'),d=document.getElementById('details');
function out(x){d.textContent+=x+'\n'}
function show(kind,title,msg){s.className='card '+kind;s.innerHTML='<div class="big">'+title+'</div><p>'+msg+'</p>'}
function pos(label,p){const c=p.coords;out(label+': lat='+c.latitude+', lon='+c.longitude+', accuracy='+Math.round(c.accuracy)+'m, age='+(Date.now()-p.timestamp)+'ms');show('ok','SAFARI GPS IS WORKING','Safari returned a location. Accuracy: '+Math.round(c.accuracy)+' meters.');}
function err(label,e){out(label+' ERROR: code='+e.code+' message='+e.message);if(e.code===1)show('bad','SAFARI LOCATION IS BLOCKED','Safari/iPhone denied location for this website.');else if(e.code===3)show('bad','SAFARI GPS TIMED OUT','Safari did not return a location before timeout.');else show('bad','SAFARI GPS ERROR',e.message||'Unknown location error.');}
async function run(){d.textContent='';show('wait','TESTING SAFARI LOCATION…','Trying normal location, precise location, and live GPS.');out('secureContext='+isSecureContext+' visibility='+document.visibilityState+' userAgent='+navigator.userAgent);if(!navigator.geolocation){show('bad','NO GEOLOCATION API','This browser is not exposing location.');return;}try{if(navigator.permissions){const p=await navigator.permissions.query({name:'geolocation'});out('permissions API geolocation='+p.state)}}catch(e){out('permissions API unavailable: '+e.message)}
navigator.geolocation.getCurrentPosition(p=>pos('NORMAL',p),e=>err('NORMAL',e),{enableHighAccuracy:false,maximumAge:300000,timeout:10000});
navigator.geolocation.getCurrentPosition(p=>pos('PRECISE',p),e=>err('PRECISE',e),{enableHighAccuracy:true,maximumAge:0,timeout:20000});
let done=false;const id=navigator.geolocation.watchPosition(p=>{if(done)return;done=true;pos('WATCH',p);navigator.geolocation.clearWatch(id)},e=>{out('WATCH ERROR: code='+e.code+' message='+e.message)},{enableHighAccuracy:true,maximumAge:0,timeout:20000});setTimeout(()=>{if(!done){out('WATCH: no position after 25 seconds');try{navigator.geolocation.clearWatch(id)}catch(e){}}},25000)}
document.getElementById('again').onclick=run;run();
</script></body></html>

name: Build ed42 Safari direct candidate

on:
  push:
    branches:
      - repair/field-simple-test-5.1-safari-direct
    paths:
      - 'tools/build-ed42-safari-direct.js'
      - 'tools/patch-direct-gps-explicit.js'
      - 'tools/patch-direct-gps-recovery-button.js'
      - 'tools/patch-direct-startup-order.js'
      - 'tools/patch-direct-gps-watch-hardening.js'
      - 'tools/patch-direct-gps-user-gated.js'
      - 'tools/patch-direct-storage-quota-v2.js'
      - 'tools/patch-direct-gps-success-status.js'
      - 'tools/patch-direct-section-crash.js'
      - 'tools/patch-direct-field-first-startup.js'
      - 'tests/ed42-safari-direct.test.js'
      - 'tests/gps-success-status.test.js'
      - 'tests/section-start-safari-crash.test.js'
      - 'tests/field-first-startup.test.js'
      - 'tests/field-simple-storage-quota.test.js'
      - 'tests/field-simple-idb-recovery.test.js'
      - 'tests/field-simple-export-survival.test.js'
      - '.github/workflows/ed42-safari-direct.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore exact four-section baseline files
        run: |
          git fetch origin freeze/field-simple-test-5.1-four-sections-20260806
          git checkout origin/freeze/field-simple-test-5.1-four-sections-20260806 -- \
            field-simple-test/app.js \
            field-simple-test/index.html \
            field-simple-test/sw.js \
            field-simple-test/frontage-workflow.js \
            field-simple-test/section-mapping.js
      - name: Build ordinary direct app files
        run: node tools/build-ed42-safari-direct.js
      - name: Apply explicit Safari GPS activation patch
        run: node tools/patch-direct-gps-explicit.js
      - name: Apply GPS recovery button patch
        run: node tools/patch-direct-gps-recovery-button.js
      - name: Fix startup ordering
        run: node tools/patch-direct-startup-order.js
      - name: Harden Safari GPS watcher recovery
        run: node tools/patch-direct-gps-watch-hardening.js
      - name: Gate GPS startup behind visible user action
        run: node tools/patch-direct-gps-user-gated.js
      - name: Move inspection state out of localStorage quota path
        run: node tools/patch-direct-storage-quota-v2.js
      - name: Verify direct Safari candidate
        run: node tests/ed42-safari-direct.test.js
      - name: Verify Safari quota-safe state persistence
        run: node tests/field-simple-storage-quota.test.js
      - name: Verify retry-safe photograph database
        run: node tests/field-simple-idb-recovery.test.js
      - name: Verify section mapping
        run: node tests/section-mapping.test.js
      - name: Verify export without ending active inspection
        run: node tests/field-simple-export-survival.test.js
      - name: Clear stale GPS waiting banner after successful fix
        run: node tools/patch-direct-gps-success-status.js
      - name: Verify GPS success display
        run: node tests/gps-success-status.test.js
      - name: Remove section-start Safari memory spike
        run: node tools/patch-direct-section-crash.js
      - name: Verify section-start Safari crash path
        run: node tests/section-start-safari-crash.test.js
      - name: Make field startup authoritative and nonblocking
        run: node tools/patch-direct-field-first-startup.js
      - name: Verify field-first startup and update-safe navigation
        run: node tests/field-first-startup.test.js
      - name: Commit verified direct files
        run: |
          if git diff --quiet HEAD -- field-simple-test/app.js field-simple-test/index.html field-simple-test/sw.js field-simple-test/frontage-workflow.js field-simple-test/section-mapping.js; then
            echo 'Verified files already match the branch.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- field-simple-test/app.js field-simple-test/index.html field-simple-test/sw.js field-simple-test/frontage-workflow.js field-simple-test/section-mapping.js
          git commit -m 'Build verified ed42 Safari direct candidate v11'
          git push origin HEAD:repair/field-simple-test-5.1-safari-direct

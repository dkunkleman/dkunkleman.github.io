        <label>Mature trees or features worth preserving<textarea id="creekPreserve"></textarea></label>
        <label>Relationship to proposed homesite or road<textarea id="creekRelationship"></textarea></label>
        <label>Why this water feature matters<textarea id="creekWhyMatters" placeholder="Access, homesite, risk, cost, or amenity"></textarea></label>
        <div id="flowingWaterEvidencePlan" class="field-warning small"></div>
      </div>
      <div id="forestSetFields" class="structured-fields" hidden>
        <label>Canopy<select id="forestCanopy"><option>open</option><option>moderate</option><option>closed</option></select></label>
        <label>Tree spacing<input id="forestSpacing" placeholder="Approximate spacing"></label>
        <label>Dominant trunk-size class<input id="forestTrunkSize"></label>
        <label>Understory<select id="forestUnderstory"><option>light</option><option>moderate</option><option>dense</option></select></label>
        <label>Walkability<select id="forestWalkability"><option>easy</option><option>moderate</option><option>difficult</option></select></label>
        <label>Mature trees that could remain<textarea id="forestPreserve"></textarea></label>
        <label>Brush/small stems likely to require clearing<textarea id="forestClearing"></textarea></label>
      </div>
      <div id="homesiteSetFields" class="structured-fields" hidden>
        <label>Estimated footprint or outline<textarea id="homesiteFootprint"></textarea></label>
        <label>View direction<input id="homesiteViewDirection"></label>
        <label>Access direction<input id="homesiteAccessDirection"></label>
        <label>Ground observations<textarea id="homesiteGround"></textarea></label>
        <label>Mature trees to preserve<textarea id="homesitePreserve"></textarea></label>
        <label>Brush or trees to remove<textarea id="homesiteRemove"></textarea></label>
        <label>Nearby water evidence<textarea id="homesiteWater"></textarea></label>
        <label>Why this location was selected<textarea id="homesiteExplanation"></textarea></label>
      </div>
    </div>
    <div class="dialog-actions"><button id="cancelEvidenceSet" class="cancel" type="button">Cancel</button><button id="createEvidenceSet" type="button">Start This Subject</button></div>
  </dialog>

  <dialog id="groupPhotoDialog">
    <div class="dialog-body">
      <h2>Same subject?</h2>
      <p id="groupPhotoPrompt">Choose this photograph's role and what to do next.</p>
      <label>Photograph role<select id="groupPhotoRole"><option>Context</option><option>Close-up</option><option>Measurement</option><option>Relationship to surroundings</option><option>Opposite direction</option><option>Whole subject</option><option>Detail</option><option>Before</option><option>After</option><option>Upstream view</option><option>Downstream view</option><option>Across-channel view</option><option>Channel width</option><option>Water depth</option><option>Flow Evidence</option><option>Adjacent Higher-Ground / Tree Context</option><option>Scenic Context</option><option>Building-Avoidance Context</option><option>Creek / homesite or road relationship</option><option>Whole tree</option><option>Bark</option><option>Base / ground</option><option>Lower trunk to first fork</option><option>Crown / canopy</option><option>Visible crown segment</option><option>Connected branch</option><option>Leaf upper surface</option><option>Leaf underside</option><option>Twig / terminal bud</option><option>Fruit / seed / cone / flower</option><option>Scale photograph</option><option>DBH tape position</option><option>Visible defect</option><option>Root condition</option><option>Targets</option><option>Surrounding canopy</option><option>Plot center / radius</option><option>Access / wet ground</option><option>360-degree panorama</option><option>Transition</option><option>Other</option></select></label>
      <label id="leafProvenanceLabel" hidden>Are you confident this leaf came from this tree?<select id="leafProvenance"><option>Yes â€” watched it fall or traced it to this tree</option><option>Probably</option><option>Unsure</option></select></label>
    </div>
    <div class="dialog-actions" style="grid-template-columns:1fr 1fr">
      <button id="continueEvidenceSet" type="button">Same subject</button>
      <button id="finishAfterGroupPhoto" type="button">End subject</button>
      <button id="newAfterGroupPhoto" type="button">New subject</button>
      <button id="removeFromEvidenceSet" class="cancel" type="button">Remove from group</button>
    </div>
  </dialog>

  <dialog id="structuredMeasurementDialog">
    <div class="dialog-body">
      <h2>What did you measure?</h2>
      <p class="field-warning"><strong>Enter the number now.</strong> This valueâ€”not a later attempt to read the photographâ€”is the authoritative field measurement.</p>
      <label>Measurement type<select id="measurementType"><option>Water depth</option><option>Width</option><option>Length</option><option>Tree diameter</option><option>Distance</option><option>Other</option></select></label>
      <label>Exact recorded value<input id="measurementValue" type="number" min="0" step="0.01" inputmode="decimal"></label>
      <label>Unit<select id="measurementUnit"><option value="in">inches</option><option value="ft">feet</option><option value="yd">yards</option><option value="m">meters</option><option value="cm">centimeters</option><option value="mm">millimeters</option><option value="other">other</option></select></label>
      <label id="measurementOtherUnitLabel" hidden>Other unit<input id="measurementOtherUnit"></label>
      <label>Measured or estimated?<select id="measurementBasis"><option>Measured</option><option>Estimated</option></select></label>
      <label>Instrument<input id="measurementInstrument" placeholder="Tape, ruler, staff, diameter tapeâ€¦"></label>
      <label>Did the device reach the true bottom/end point?<select id="measurementReachedEnd"><option>Unknown</option><option>Yes</option><option>No</option></select></label>
      <label>Was the device approximately vertical or level?<select id="measurementAligned"><option>Unknown</option><option>Yes</option><option>No</option><option>Not applicable</option></select></label>
      <label>Subject or photo group<select id="measurementSubject"></select></label>
      <div id="measurementWaterFields" class="structured-fields">
        <label>Bottom condition<select id="measurementWaterBottom"><option>Unknown</option><option>Soft bottom</option><option>Firm bottom</option></select></label>
        <label>Water setting<select id="measurementWaterContext"><option value="">Choose one</option><option>Isolated puddle</option><option>Pooled area</option><option>Ditch</option><option>Creek</option></select></label>
        <label>Approximate surface length (feet)<input id="measurementSurfaceLength" type="number" min="0" step="0.1" inputmode="decimal"></label>
        <label>Approximate surface width (feet)<input id="measurementSurfaceWidth" type="number" min="0" step="0.1" inputmode="decimal"></label>
      </div>
      <p class="small">Optional voice explanation: the voice explanation already recorded for this photograph remains directly linked to this measurement.</p>
    </div>
    <div class="dialog-actions"><button id="cancelStructuredMeasurement" class="cancel" type="button">Cancel</button><button id="saveStructuredMeasurement" type="button">Save Measurement</button></div>
  </dialog>

  <dialog id="plotTreeDialog">
    <div class="dialog-body">
      <h2>Add qualifying plot tree</h2>
      <p id="plotTreePlotName" class="field-warning">Record every qualifying tree rooted inside the stated radius.</p>
      <label>Probable species<input id="plotTreeSpecies" placeholder="Unknown is acceptable"></label>
      <label>Alternative species<input id="plotTreeAlternatives" placeholder="Comma separated"></label>
      <label>Identification status<select id="plotTreeStatus"><option>Unknown</option><option>Inspector confirmed</option><option>Probable</option><option>Possible</option><option>Professional identification requested</option></select></label>
      <label>Identification confidence<select id="plotTreeConfidence"><option>low</option><option>medium</option><option>high</option></select></label>
      <label>DBH method<select id="plotTreeDbhMethod"><option>Not measured</option><option>Diameter tape reading</option><option>Circumference converted to diameter</option><option>Biltmore-stick estimate</option><option>Visual estimate</option></select></label>
      <label>Diameter reading (inches)<input id="plotTreeDbh" type="number" min="0" step="0.1" inputmode="decimal"></label>
      <label>Circumference reading (inches)<input id="plotTreeCircumference" type="number" min="0" step="0.1" inputmode="decimal"></label>
      <label>DBH instrument<input id="plotTreeInstrument"></label>
      <label>DBH confidence<select id="plotTreeDbhConfidence"><option>unknown</option><option>low</option><option>medium</option><option>high</option></select></label>
      <label>Merchantable height (feet)<input id="plotTreeMerchantableHeight" type="number" min="0" step="1" inputmode="decimal"></label>
      <label>Usable 16-foot logs, nearest half-log<input id="plotTreeLogs" type="number" min="0" step="0.5" inputmode="decimal"></label>
      <label>Height method<select id="plotTreeHeightMethod"><option>Unknown</option><option>Laser rangefinder/clinometer</option><option>Tree scale stick</option><option>Phone estimate</option><option>Visual estimate</option></select></label>
      <label>Product category<select id="plotTreeProduct"><option>Unknown</option><option>Pulpwood</option><option>Chip-n-saw</option><option>Sawtimber</option><option>Veneer candidate</option><option>Nonmerchantable</option></select></label>
      <label>Visible defects<input id="plotTreeDefects" placeholder="Comma separated; photograph every significant defect"></label>
      <label>Purposes<input id="plotTreePurposes" placeholder="Timber, preserve, clearing obstacleâ€¦"></label>
      <label>Inspector explanation<textarea id="plotTreeExplanation"></textarea></label>
      <label class="water-rule"><input id="plotTreePhoto" type="checkbox" checked>Take supporting photograph after saving</label>
    </div>
    <div class="dialog-actions"><button id="cancelPlotTree" class="cancel" type="button">Cancel</button><button id="savePlotTree" type="button">Save Plot Tree</button></div>
  </dialog>

  <dialog id="hypothesisDialog">
    <div class="dialog-body">
      <h2>Inspector Hypothesis</h2>
      <p class="small">A hypothesis is your interpretation, not an observed fact and not a construction recommendation.</p>
      <label>Hypothesis statement<textarea id="hypothesisStatement" placeholder="What do you think may be happening?"></textarea></label>
      <label>Triggering observations<select id="hypothesisObservations" multiple size="5"></select></label>
      <label>Supporting photographs<select id="hypothesisPhotos" multiple size="5"></select></label>
      <label>Contradicting evidence records<select id="hypothesisContradictions" multiple size="4"></select></label>
      <label>Exact question needing verification<textarea id="hypothesisQuestion" placeholder="What exact question should a professional answer?"></textarea></label>
      <label>Professional type<select id="hypothesisProfessional"><option>civil/drainage engineer</option><option>surveyor</option><option>builder</option><option>forester</option><option>soil/septic professional</option><option>other professional</option></select></label>
      <label>Cheapest next evidence-gathering step<textarea id="hypothesisNextStep" placeholder="Measurement, record check, targeted return visit, or narrow professional question"></textarea></label>
      <label>Contradicting evidence note, if any<textarea id="hypothesisContradiction" placeholder="Record what could disprove this idea"></textarea></label>
    </div>
    <div class="dialog-actions">
      <button id="cancelHypothesis" class="cancel" type="button">Cancel</button>
      <button id="saveHypothesis" type="button">Save as Hypothesis</button>
    </div>
  </dialog>

  <dialog id="waterClassificationDialog">
    <div class="dialog-body">
      <h2>Does this photograph show water?</h2>
      <p class="small">Confirm what you personally observed. The app will never silently classify water.</p>
      <div id="waterTypeChoices" class="water-choice-grid">
        <button type="button" data-water-choice="standing">Yes â€” Standing Water</button>
        <button type="button" data-water-choice="flowing">Yes â€” Flowing Water</button>
        <button type="button" data-water-choice="ditch">Yes â€” Ditch</button>
        <button type="button" data-water-choice="creek_stream">Yes â€” Creek or Stream</button>
        <button type="button" data-water-choice="other">Yes â€” Other Water</button>
        <button type="button" data-water-choice="no" class="cancel">No</button>
        <button type="button" data-water-choice="unsure" class="cancel">Unsure</button>
      </div>
      <div id="waterMeasurementFields" class="structured-fields" hidden>
        <label>Depth<select id="photoWaterDepth"><option value="unknown">Unknown</option><option value="less_than_1_inch">Less than 1 inch</option><option value="1-3_inches">1â€“3 inches</option><option value="3-7_inches">3â€“7 inches</option><option value="8-12_inches">8â€“12 inches</option><option value="more_than_12_inches">More than 12 inches</option><option value="exact">Exact entry</option></select></label>
        <label id="photoWaterExactLabel" hidden>Exact depth in inches<input id="photoWaterExact" type="number" min="0" step="0.25" inputmode="decimal"></label>
        <label>Measurement basis<select id="photoWaterBasis"><option>Unknown</option><option>Estimated</option><option>Measured</option></select></label>
        <label>Approximate width in feet<input id="photoWaterWidth" type="number" min="0" step="0.5" inputmode="decimal" placeholder="Unknown if blank"></label>
        <label>Approximate length in feet<input id="photoWaterLength" type="number" min="0" step="0.5" inputmode="decimal" placeholder="Unknown if blank"></label>
        <label>Water behavior<select id="photoWaterBehavior"><option value="unknown">Unknown</option><option value="isolated_depression">Isolated depression</option><option value="connected_pooling">Connected pooling</option><option value="flowing">Flowing</option><option value="apparent_creek_channel">Apparent creek channel</option><option value="ditch">Ditch</option></select></label>
        <button id="saveWaterClassification" type="button">Save Water Evidence</button>
      </div>
    </div>
  </dialog>

  <dialog id="waterPhotoDialog">
    <div class="dialog-body">
      <button id="closeWaterPhoto" class="cancel" type="button">Close</button>
      <h2 id="waterPhotoTitle">Water photograph</h2>
      <img id="waterPhotoImage" alt="Water evidence photograph">
      <p id="waterPhotoDetails" class="small"></p>
      <audio id="waterPhotoAudio" controls hidden></audio>
    </div>
  </dialog>

  <script src="../field-simple-test/inspection-coaching.js?v=3.13.0-home-test.5.4"></script>
  <script src="../field-simple-test/water-intelligence.js?v=3.13.0-home-test.5.4"></script>
  <script src="../field-simple-test/evidence-governance.js?v=3.13.0-home-test.5.4"></script>
  <script src="../field-simple-test/evidence-sets.js?v=3.13.0-home-test.5.4"></script>
  <script src="../field-simple-test/timber-reconnaissance.js?v=3.13.0-home-test.5.4"></script>
  <script src="../field-simple-test/reviewed-property-synthesis.js?v=3.13.0-home-test.5.4"></script>
  <script src="../field-simple-test/authoritative-weather.js?v=3.13.0-home-test.5.4"></script>
  <script src="../field-simple-test/frontage-workflow.js?v=3.13.0-home-test.5.4"></script>
  <script src="../field-simple-test/automatic-context.js?v=3.13.0-home-test.5.4"></script>
  <script src="./section-mapping.js?v=3.13.0-home-test.5.4"></script>
  <script src="../field-simple-test/wet-edge-mapping.js?v=3.13.0-home-test.5.4"></script>
  <script src="../field-simple-test/property-review.js?v=3.13.0-home-test.5.4"></script>
  <script src="./inspection-package.js?v=3.13.0-home-test.5.4"></script>
  <script src="../field-simple-test/idb-recovery.js?v=3.13.0-home-test.5.4"></script>
  <script src="./app.js?v=3.13.0-home-test.5.4"></script>
</body>
</html>

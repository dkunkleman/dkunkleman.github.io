<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Property Inspector — Recover Saved Inspection</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #eef3ed; color: #152219; }
    main { max-width: 680px; min-height: 100vh; margin: 0 auto; padding: max(20px, env(safe-area-inset-top)) 14px max(28px, env(safe-area-inset-bottom)); }
    h1 { margin: 0 0 12px; font-size: clamp(30px, 8vw, 46px); line-height: 1.02; }
    .safe { padding: 14px; border: 3px solid #17652e; border-radius: 14px; background: #fff; font-size: 20px; font-weight: 800; }
    #export { width: 100%; min-height: 118px; margin: 18px 0 10px; padding: 16px; border: 0; border-radius: 16px; background: #17652e; color: #fff; font-size: 26px; font-weight: 900; }
    #export:disabled { background: #69756c; }
    #status { min-height: 90px; padding: 14px; border-radius: 12px; background: #fff; font-size: 19px; line-height: 1.35; white-space: pre-wrap; }
    #download { display: none; width: 100%; min-height: 82px; margin-top: 14px; padding: 24px 12px; border-radius: 14px; background: #f2cf28; color: #161200; font-size: 24px; font-weight: 900; text-align: center; text-decoration: none; }
    .warning { font-weight: 800; color: #721b13; }
  </style>
</head>
<body>
  <main>
    <h1>Recover Your Saved Inspection</h1>
    <div class="safe">This page only reads and copies your saved evidence. It does not clear, migrate, rename, or change anything.</div>
    <button id="export" type="button">EXPORT RAW RECOVERY ARCHIVE</button>
    <div id="status">Tap the green button once. Keep Safari open while the ZIP is created.</div>
    <a id="download" download>DOWNLOAD RECOVERY ZIP</a>
    <p class="warning">Do not press Clear in the Property Inspector app.</p>
  </main>
  <script src="./inspection-package.js?recovery=1"></script>
  <script src="./recover.js?recovery=1"></script>
</body>
</html>
